# .github/workflows/release.yml

name: 'Release'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: 'Release'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check changesets
        run: npm run changeset:check

      - name: Check release state
        id: release-state
        shell: bash
        run: |
          changeset_count=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          package_name=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")
          package_version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            version_published=true
          else
            version_published=false
          fi

          echo "has_changesets=$([ "$changeset_count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version_published=$version_published" >> "$GITHUB_OUTPUT"

      - name: Prepare release PR
        if: steps.release-state.outputs.has_changesets == 'true'
        run: npm run release:prepare

      - name: Create or update release PR
        if: steps.release-state.outputs.has_changesets == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          branch-token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          branch: changeset-release/main
          base: main
          commit-message: 'Version packages'
          title: 'Version packages'
          body: |
            This PR was opened by the release workflow.

            Merge it when you are ready to publish the prepared package version to npm.

      - name: Publish release
        if: steps.release-state.outputs.has_changesets == 'false' && steps.release-state.outputs.version_published == 'false'
        id: publish
        uses: changesets/action@v1
        with:
          publish: npm run release:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
