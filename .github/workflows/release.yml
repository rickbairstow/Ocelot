name: Release Package

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump (creates a PR; merge it to publish)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ${{ inputs.version }} release PR
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Check release automation token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.RELEASE_PR_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Configure RELEASE_GITHUB_TOKEN (or RELEASE_PR_TOKEN) with Contents and Pull requests read/write access to this repository. The built-in GITHUB_TOKEN requires approval for release PR checks, so it cannot be used for unattended release preparation."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.RELEASE_PR_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: version
        run: |
          npm version "${{ inputs.version }}" --no-git-tag-version
          version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.RELEASE_PR_TOKEN }}
        run: |
          branch="release/${{ steps.version.outputs.tag }}"
          pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr_number" ]; then
            previous_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json number --jq '.[0].number // empty')
            if [ -n "$previous_pr" ]; then
              branch="$branch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
          fi
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "Release ${{ steps.version.outputs.tag }}"
          git fetch origin "$branch" || true
          git push origin HEAD:"$branch" --force-with-lease

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release ${{ steps.version.outputs.tag }}" \
              --body "Bumps ocelot-ui to ${{ steps.version.outputs.tag }}. Merging this PR publishes the package through npm Trusted Publishing and creates the matching GitHub Release."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "Release ${{ steps.version.outputs.tag }}" \
              --body "Bumps ocelot-ui to ${{ steps.version.outputs.tag }}. Merging this PR publishes the package through npm Trusted Publishing and creates the matching GitHub Release."
          fi

          pr_url=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --base main --state open --json url --jq '.[0].url // empty')
          if [ -z "$pr_url" ]; then
            echo "::error::Release preparation did not produce an open pull request."
            exit 1
          fi
          echo "::notice title=Release PR ready::$pr_url"
          printf '### Release %s prepared\n\n[Open the release pull request](%s)\n\nThe version bump is ready for review. **This run has not published to npm.**\n\nAfter the checks pass, merge the PR into `main` to trigger publishing and create the GitHub release.\n' \
            "${{ steps.version.outputs.tag }}" "$pr_url" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.RELEASE_PR_TOKEN || github.token }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm publication and release tag
        id: release
        run: node .github/scripts/check-release.mjs

      - name: Install dependencies
        if: steps.release.outputs.published != 'true'
        run: npm ci

      - name: Test release checks
        run: node --test .github/scripts/check-release.test.mjs

      - name: Install Playwright browsers
        if: steps.release.outputs.published != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run lint
        if: steps.release.outputs.published != 'true'
        run: npm run lint

      - name: Run tests
        if: steps.release.outputs.published != 'true'
        run: npm run test:run

      - name: Check Vue and TypeScript types
        if: steps.release.outputs.published != 'true'
        run: npm run check-types

      - name: Build package
        if: steps.release.outputs.published != 'true'
        run: npm run build

      - name: Publish to npm
        if: steps.release.outputs.published != 'true'
        run: npm publish --access public --provenance

      - name: Create or verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.RELEASE_PR_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          if [ "${{ steps.release.outputs.tag_exists }}" != 'true' ]; then
            git tag "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --notes "Release $RELEASE_TAG"
          fi
          printf '### Release ready\n\n[npm package](https://www.npmjs.com/package/ocelot-ui/v/%s) · [GitHub release](https://github.com/%s/releases/tag/%s)\n' \
            "${{ steps.release.outputs.version }}" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
