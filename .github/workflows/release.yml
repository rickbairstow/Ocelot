# .github/workflows/release.yml

name: 'Release'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: 'Publish to npm'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      - name: Build package
        run: npm run build

      - name: Check changesets
        run: npm run changeset:check

      - name: Check package version
        id: package
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published; skipping npm publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$PACKAGE_NAME@$PACKAGE_VERSION is not published yet."
          fi

          RELEASE_TAG="v$PACKAGE_VERSION"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
            echo "GitHub release $RELEASE_TAG already exists."
          else
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
            echo "GitHub release $RELEASE_TAG does not exist yet."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish package
        if: steps.package.outputs.published == 'false'
        run: npm run changeset:publish

      - name: Create GitHub release
        if: steps.package.outputs.release_exists == 'false'
        run: |
          gh release create "${{ steps.package.outputs.tag }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.package.outputs.tag }}" \
            --notes "Published ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} to npm."
        env:
          GH_TOKEN: ${{ github.token }}
