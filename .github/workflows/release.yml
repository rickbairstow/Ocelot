# .github/workflows/release.yml

name: 'Release'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: 'Release'
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Check changesets
        run: npm run changeset:check

      - name: Check release state
        id: release-state
        shell: bash
        run: |
          changeset_count=$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          package_name=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).name")
          package_version=$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            version_published=true
          else
            version_published=false
          fi

          should_run=false

          if [ "$changeset_count" -gt 0 ] || [ "$version_published" = "false" ]; then
            should_run=true
          fi

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Create release PR or publish
        if: steps.release-state.outputs.should_run == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run release:prepare
          publish: npm run release:publish
          commit: 'Version packages'
          title: 'Version packages'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
